<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:linear-gradient(150deg,#003F79,#002A52);color:#fff;min-height:100vh;padding:44px 16px}
.box{width:min(920px,100%);margin:0 auto;text-align:center}
.logo{background:#fff;display:inline-block;padding:14px 22px;border-radius:16px;margin-bottom:26px}
.logo img{height:44px;display:block}
.migas{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:13px;margin-bottom:14px;color:rgba(255,255,255,.55)}
.migas a{color:rgba(255,255,255,.85);text-decoration:none}.migas a:hover{color:#fff;text-decoration:underline}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.15}
h1 span{color:#FF4D63}
p.sub{color:rgba(255,255,255,.75);margin:12px 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;text-align:left}
.card{display:flex;align-items:center;gap:12px;padding:18px 20px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;transition:.2s;flex-wrap:wrap}
.card i{display:flex;width:34px;height:23px;border-radius:4px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.card .t{font-size:18px;font-weight:600;flex:1}
.card em{font-style:normal;font-size:13px;color:#FF8A99;width:100%}
.card i + .t + em{padding-left:46px}
a.card:hover{background:#D50926;border-color:#D50926;transform:translateY(-2px)}
a.card:hover em{color:#fff}
.card.off{opacity:.45;border-style:dashed}
.card.off em{color:rgba(255,255,255,.7)}
.back{display:inline-block;margin-top:30px;font-size:14px;color:rgba(255,255,255,.75);text-decoration:none}
.back:hover{color:#fff}
</style>
</head>
